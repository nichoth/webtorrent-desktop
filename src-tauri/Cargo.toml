[package]
name = "webtorrent-desktop"
# Kept in sync with `version` in package.json by hand. Nothing reads
# both, so nothing catches a drift; the packaging stories (US-083,
# US-084) are where this stops being cosmetic.
version = "0.24.0"
description = "Streaming torrent client"
authors = ["WebTorrent, LLC"]
license = "MIT"
edition = "2021"
# Tauri 2's stated minimum (ADR-014).
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Single-instance is a host concern the Electron main process gets from
# `app.requestSingleInstanceLock()` (US-056).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# Not just for tests since US-056: the saved window bounds are read out
# of the renderer's `config.json` before the renderer exists.
serde_json = "1"
tauri-plugin-dialog = "2"
