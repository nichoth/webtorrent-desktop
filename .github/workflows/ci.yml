name: ci
on: [push,pull_request]
jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only, and arm64: the app targets one platform (ADR-017)
        # and stages one Node runtime for one triple (ADR-016).
        os:
          - macos-latest
        node:
          - '26'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Matches package.yml. This workflow had no npm cache at all.
          cache: npm
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
